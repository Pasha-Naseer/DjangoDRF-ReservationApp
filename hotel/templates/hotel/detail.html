{% extends 'hotel/base.html' %}
{% load humanize %}
{% block content %}

<section class="py-5" style="background:#f5f0eb;">
  <div class="container">
    <div class="row justify-content-center">

      <!-- Room Card -->
      <div class="col-md-8 text-center" style="background:#fff7f0; padding:40px;
           border-radius:20px; box-shadow:0 8px 25px rgba(90,56,30,0.15);">

        <!-- Room Image Slider -->
        <div id="roomCarousel" class="carousel slide mb-4" data-bs-ride="carousel" style="border-radius:16px; overflow:hidden;">
          <div class="carousel-inner">

            <div class="carousel-item active">
              <img src="{{ room.image.url }}" class="d-block w-100"
                   alt="اقامتگاه گردشگری کندوان خانه های سنگی" style="border-radius:16px; box-shadow:0 6px 18px rgba(90,56,30,0.1);">
            </div>

            <div class="carousel-item">
              <img src="{{ room.image_1.url }}" class="d-block w-100"
                   alt="اقامتگاه گردشگری کندوان خانه های سنگی" style="border-radius:16px; box-shadow:0 6px 18px rgba(90,56,30,0.1);">
            </div>

            <div class="carousel-item">
              <img src="{{ room.image_2.url }}" class="d-block w-100"
                   alt="اقامتگاه گردشگری کندوان خانه های سنگی" style="border-radius:16px; box-shadow:0 6px 18px rgba(90,56,30,0.1);">
            </div>

            <div class="carousel-item">
              <img src="{{ room.image_3.url }}" class="d-block w-100"
                   alt="اقامتگاه گردشگری کندوان خانه های سنگی" style="border-radius:16px; box-shadow:0 6px 18px rgba(90,56,30,0.1);">
            </div>

            <div class="carousel-item">
              <img src="{{ room.image_4.url }}" class="d-block w-100"
                   alt="اقامتگاه گردشگری کندوان خانه های سنگی" style="border-radius:16px; box-shadow:0 6px 18px rgba(90,56,30,0.1);">
            </div>

          </div>

          <!-- Carousel Controls -->
          <button class="carousel-control-prev" type="button" data-bs-target="#roomCarousel" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Previous</span>
          </button>
          <button class="carousel-control-next" type="button" data-bs-target="#roomCarousel" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Next</span>
          </button>
        </div>

        <!-- Room Name -->
        <h1 style="color:#5a381e; font-weight:bold; font-family:'Vazir', sans-serif; margin-bottom:20px;">
          {{ room.name }}
        </h1>

        <!-- Room Description -->
        <p style="color:#5a381e; font-size:1.1rem; line-height:1.8; font-family:'Vazir', sans-serif; margin-bottom:25px;">
          {{ room.description }}
        </p>


   <!-- Room Price -->
{% if room.has_discount %}
<!-- Room Price with Discount -->
<div style="text-align:center; margin-bottom:30px; font-family:'Vazir', sans-serif;">
  <h4 style="color:#c49a6c; font-weight:bold; font-size:1.5rem; margin:0;">{{ room.price_with_discount|intcomma }}T</h4>
  <span style="display:block; font-weight:500; font-size:1rem; color:#5a381e; margin-top:5px;">
    برای هر شب
  </span>
</div>

{% else %}
 <div style="text-align:center; margin-bottom:30px; font-family:'Vazir', sans-serif;">
  <h4 style="color:#c49a6c; font-weight:bold; font-size:1.5rem; margin:0;">
    {{ room.price_per_night|intcomma }}T
  </h4>
  <span style="display:block; font-weight:500; font-size:1rem; color:#5a381e; margin-top:5px;">
    برای هر شب
  </span>
</div>
{% endif %}



        <!-- Reserve Button -->
        <a href="{% url 'hotel:reservation' room.id %}"
           style="display:inline-block; padding:14px 36px; background:linear-gradient(145deg, #c49a6c, #a77c4c);
                  color:#fff; border-radius:16px; font-weight:bold; text-decoration:none;
                  box-shadow:0 6px 20px rgba(90,56,30,0.3); transition:0.3s; font-family:'Vazir', sans-serif;">
          رزرو
        </a>

      </div>
    </div>
  </div>
</section>

<script>
  // Button hover animation
  const reserveBtn = document.querySelector('a[href*="reservation"]');
  reserveBtn.addEventListener("mouseover", () => {
    reserveBtn.style.background = "linear-gradient(145deg, #a77c4c, #c49a6c)";
    reserveBtn.style.transform = "translateY(-2px)";
    reserveBtn.style.boxShadow = "0 8px 25px rgba(90,56,30,0.4)";
  });
  reserveBtn.addEventListener("mouseout", () => {
    reserveBtn.style.background = "linear-gradient(145deg, #c49a6c, #a77c4c)";
    reserveBtn.style.transform = "translateY(0)";
    reserveBtn.style.boxShadow = "0 6px 20px rgba(90,56,30,0.3)";
  });
</script>

{% endblock %}
