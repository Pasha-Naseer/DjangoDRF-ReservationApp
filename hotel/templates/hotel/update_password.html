{% extends 'hotel/base.html' %}

{% block content %}

<section id="password-update" class="py-5" style="background:#f8f4ee;">
  <div class="container">
    <div class="row justify-content-center text-center">

      <!-- Title -->
      <h1 class="section-title mt-4 mb-5" data-aos="fade-up"
          style="color:#7b5e2d; font-weight:700; letter-spacing:0.5px;">
        تغییر رمز کاربر
      </h1>

      <!-- Password Form Card -->
      <div class="col-md-6" data-aos="fade-up" data-aos-delay="200">
        <div class="p-4 shadow-lg rounded-3"
             style="background:#fff; border-radius:20px; box-shadow:0 6px 20px rgba(0,0,0,0.1);">

          <form method="POST" action="{% url 'hotel:update_password' %}" style="text-align:center;">
            {% csrf_token %}
            <div style="text-align:right; direction:rtl;">
              {{ form.as_p }}
            </div>

            <button type="submit"
                    class="btn w-100 mt-3"
                    style="background:#b88a44; color:#fff; border:none; border-radius:12px; font-weight:600; padding:10px 0;">
              تغییر رمز
            </button>
          </form>

          <hr class="my-4" style="border-top:1px solid #eee;">

          <a href="{% url 'hotel:update' %}"
             class="btn w-100"
             style="background:#7b5e2d; color:#fff; border:none; border-radius:12px; font-weight:600; padding:10px 0;">
             بازگشت به پروفایل
          </a>
        </div>
      </div>

    </div>
  </div>
</section>

{% endblock %}
