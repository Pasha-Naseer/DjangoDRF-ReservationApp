{% extends 'hotel/base.html' %}

{% block content %}
<div class="container mt-5 mb-5">
  <h1 class="text-center mb-4" style="
    font-family: 'Vazirmatn', sans-serif;
    color: #5e3b1f;
    font-weight: 700;
  ">
    به بخش وبلاگ‌های سهندکندوان خوش آمدید
  </h1>

  <div class="row justify-content-center gx-0"> <!-- remove horizontal gutters -->
    {% for weblog in weblogs %}
      <div class="col-sm-10 col-md-6 col-lg-4 mb-4 px-0"> <!-- remove side padding -->
        <div class="card shadow-lg border-0 mx-auto" style="
          background: #f9f5f0;
          border-radius: 16px;
          overflow: hidden;
          max-width: 380px;
          transition: transform 0.3s ease, box-shadow 0.3s ease;
        " onmouseover="this.style.transform='translateY(-6px)'; this.style.boxShadow='0 10px 20px rgba(94,59,31,0.2)'" onmouseout="this.style.transform='none'; this.style.boxShadow='0 6px 12px rgba(0,0,0,0.1)'">
          
          <!-- Image -->
           <a href="{% url 'hotel:weblog_detail' weblog.id %}">
          <img src="{{ weblog.blog_image.url }}" alt="خانه های سنگی روستای گردشگری کندوان" style="
            width: 100%;
            height: auto;
            max-height: 220px;
            object-fit: cover;  /* fills the card */
            display: block;
          ">
           </a>

          <!-- Text & Button Area -->
          <div class="card-body text-center" style="
            direction: rtl;
            font-family: 'Vazirmatn', sans-serif;
            background: linear-gradient(180deg, #ede1d2 0%, #f5e8da 100%);
            color: #4b2e16;
            padding: 18px;
            border-top: 1px solid #d6c0a8;
          ">
            <h2 style="
              color: #6b441f;
              font-size: 1rem;
              font-weight: 600;
              margin-bottom: 0.75rem;
              text-align: center; /* center title */
            ">
              {{ weblog.title }}
            </h2>

            <p style="
              color: #4b2e16;
              line-height: 1.8;
              font-size: 0.95rem;
              white-space: pre-line;
              min-height: 90px;
              margin-bottom: 1rem;
              text-align: justify;
            ">
              {{ weblog.summary }}...
            </p>
            <br/>
            <div>
              <a href="{% url 'hotel:weblog_detail' weblog.id %}" class="btn" style="
                background: linear-gradient(135deg, #8b5a2b, #b8860b);
                color: #fff8e7;
                border-radius: 10px;
                padding: 8px 20px;
                font-weight: 600;
                font-size: 0.9rem;
                box-shadow: 0 3px 8px rgba(0,0,0,0.15);
                transition: all 0.3s ease;
              " onmouseover="this.style.boxShadow='0 6px 12px rgba(138,99,41,0.3)'; this.style.opacity='0.9'" onmouseout="this.style.boxShadow='0 3px 8px rgba(0,0,0,0.15)'; this.style.opacity='1'">
                مطالعه بیشتر
              </a>
            </div>
          </div>
        </div>
      </div>
    {% endfor %}
  </div>
</div>
{% endblock %}
